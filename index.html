<!DOCTYPE html>
<html lang="en">
<body>

  <h2>Registration Form</h2>

  <form action="/submit" method="get">

    <label for="name">Name:</label>
    <input type="text" id="name" name="username">

    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">

    <br><br>

    <button type="submit">Submit</button>

  </form>
  <meter value="7" min="0" max="10"></meter>
  <p>Storage used:</p>
<meter value="60" min="0" max="100">60%</meter>
<progress value="60" max="100"></progress>
<label for="num1">First number:</label>
<input type="number" id="num1" value="10">

<label for="num2">Second number:</label>
<input type="number" id="num2" value="20">

<button type="button" onclick="addNumbers()">Add</button>

<p>Result: <output id="result">0</output></p>

<script>
  function addNumbers() {
    const a = Number(document.getElementById("num1").value);
    const b = Number(document.getElementById("num2").value);

    document.getElementById("result").textContent = a + b;
  }
</script>
<select name="course" id="course">
  <option value="html">HTML</option>
  <option value="css">CSS</option>
  <option value="javascript">JavaScript</option>
</select>
<label for="languages">Choose languages:</label>

<select id="languages" name="languages" multiple>
  <option value="javascript">JavaScript</option>
  <option value="python">Python</option>
  <option value="java">Java</option>
</select>
<select>
  <button>
    <selectedcontent></selectedcontent>
  </button>

  <option value="html">HTML</option>
  <option value="css">CSS</option>
</select>
<details>
  <summary>What is HTML?</summary>
  <p>HTML is used to structure content on webpages.</p>
</details>
<dialog id="myDialog">
  <p>Hello! This is a dialog box.</p>
  <button onclick="document.getElementById('myDialog').close()">
    Close
  </button>
</dialog>

<button onclick="document.getElementById('myDialog').showModal()">
  Open Dialog
</button>
<geolocation>
  <button id="fallback">Use location</button>
</geolocation>

<p id="output"></p>
</body>
